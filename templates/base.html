<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Productivity Suite — PT Telkom Indonesia Enterprise Division">
    <title>{% block title %}Productivity Suite{% endblock %} — Telkom Enterprise</title>

    <!-- Google Fonts: Plus Jakarta Sans + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Hamburger button untuk mobile -->
    <button class="hamburger" id="hamburgerBtn" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Overlay untuk sidebar mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="app-shell">
        <!-- === Sidebar Navigation === -->
        <aside class="sidebar" id="sidebar">
            <!-- Logo Telkom -->
            <img
                src="{{ url_for('static', filename='assets/telkom_logo.png') }}"
                alt="Telkom Indonesia"
                class="sidebar__logo"
            >
            <!-- Nama aplikasi -->
            <div class="sidebar__title">Productivity Suite</div>

            <!-- Navigasi halaman -->
            <nav class="sidebar__nav">
                <a
                    href="{{ url_for('absensi.index') }}"
                    class="sidebar__nav-item {% if request.endpoint and request.endpoint.startswith('absensi') %}sidebar__nav-item--active{% endif %}"
                    id="nav-absensi"
                >
                    <!-- Icon: Clipboard -->
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
                        <path d="M9 14l2 2 4-4"/>
                    </svg>
                    Absensi
                </a>

                <a
                    href="{{ url_for('dashboard.index') }}"
                    class="sidebar__nav-item {% if request.endpoint and request.endpoint.startswith('dashboard') %}sidebar__nav-item--active{% endif %}"
                    id="nav-dashboard"
                >
                    <!-- Icon: Bar Chart -->
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"/>
                        <line x1="12" y1="20" x2="12" y2="4"/>
                        <line x1="6" y1="20" x2="6" y2="14"/>
                    </svg>
                    Dashboard
                </a>

                <a
                    href="{{ url_for('artikel.index') }}"
                    class="sidebar__nav-item {% if request.endpoint and request.endpoint.startswith('artikel') %}sidebar__nav-item--active{% endif %}"
                    id="nav-artikel"
                >
                    <!-- Icon: File Text -->
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    Artikel
                </a>
            </nav>

            <!-- Logout link -->
            <a href="/logout" class="sidebar__nav-item sidebar__logout" id="nav-logout">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                Logout
            </a>

            <!-- Label versi di bawah -->
            <div class="sidebar__version">v1.0.0</div>
        </aside>

        <!-- === Main Content === -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
